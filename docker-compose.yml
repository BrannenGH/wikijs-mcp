services:
  wikijs-mcp:
    build:
      context: .
    container_name: wikijs-mcp
    restart: unless-stopped
    ports:
      - "${WIKIJS_MCP_BIND_ADDR:-0.0.0.0}:${WIKIJS_MCP_PORT:-5094}:8000"
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      MCP_TRANSPORT: streamable-http
      MCP_SCRIPT_TIMEOUT_SECONDS: 90
    env_file:
      - path: ./wikijs.env
        required: false
